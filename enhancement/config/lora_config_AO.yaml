# ============================================================
# LoRA 微调配置 (AO 数据集 - Llama2-7B FP16, retrieval 模板)
# 对齐原论文: lora_r=8, lora_alpha=16, 5 epochs + 早停
# ============================================================

# 基座模型
model:
  base_model: "/root/autodl-tmp/URLLM-project/models/Llama-2-7b-hf/models/shakechen--Llama-2-7b-hf/snapshots/master"
  lora_r: 8                                     # 对齐原论文 r=8
  lora_alpha: 16                                # 对齐原论文 alpha=16
  lora_dropout: 0.05
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# 训练参数
training:
  num_epochs: 5                                  # 5 epochs (配合早停防止过拟合)
  max_steps: -1
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  max_seq_length: 1024
  weight_decay: 0.01
  fp16: true
  bf16: false
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 5
  gradient_checkpointing: true
  early_stopping_patience: 3                     # 连续3次eval_loss未下降则停止
  early_stopping_threshold: 0.001                # 最小改善阈值

# 数据路径 (AO 数据集)
data:
  train_file: "train_instructions_AO.json"
  valid_file: "valid_instructions_AO.json"

# 推理配置
inference:
  batch_size: 8
  temperature: 0.1
  max_new_tokens: 128

# 输出
output:
  save_dir: "lora_weights"
  log_dir: "logs_AO"
