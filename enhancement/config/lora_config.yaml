# ============================================================
# LoRA 微调配置
# ============================================================

# 基座模型
model:
  base_model: "/root/autodl-tmp/URLLM-project/models/Llama-2-7b-hf/models/shakechen--Llama-2-7b-hf/snapshots/master"   # 必须与训练时基座一致 (base 版, 非 chat); 见 adapter_config.json 的 base_model_name_or_path
  lora_r: 8                                      # LoRA rank
  lora_alpha: 16                                 # LoRA alpha (通常 2x rank)
  lora_dropout: 0.05
  lora_target_modules:                           # 应用 LoRA 的模块
    - "q_proj"
    - "v_proj"

# 训练参数
training:
  num_epochs: 3
  batch_size: 2                                  # per-device batch size (24GB 下 4 会 OOM, 降为 2)
  gradient_accumulation_steps: 16                # effective batch = 2*16 = 32 (保持不变)
  gradient_checkpointing: true                   # 显式开启梯度检查点 (省激活显存)
  per_device_eval_batch_size: 2                  # 显式限制 eval batch (默认 8 会在 step200 评估时爆显存)
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  max_seq_length: 2048                           # 最大序列长度 (含候选列表)
  weight_decay: 0.01
  fp16: true                                     # 使用 FP16 混合精度
  bf16: false                                    # A100 可设为 true
  logging_steps: 50
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3                            # 最多保留 3 个 checkpoint
  resume_from_checkpoint: "checkpoint-500"

# 数据路径
data:
  train_file: "train_instructions.json"
  valid_file: "valid_instructions.json"

# 推理配置
inference:
  batch_size: 2                                  # 推理 batch size (4bit 模型 + 24GB 下 8 会 OOM, 降为 2)
  temperature: 0.0                               # 贪心解码 → 输出格式稳定
  max_new_tokens: 128                            # 最大生成 token

# 输出
output:
  save_dir: "outputs/lora_weights"
  log_dir: "outputs/logs"
